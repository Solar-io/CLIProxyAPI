name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdown-check:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Lint markdown files
        run: npx --yes markdownlint-cli2 --config .markdownlint-cli2.jsonc 'docs/**/*.md' '*.md'

      - name: Check links in markdown
        run: |
          npx --yes markdown-link-check \
            --quiet \
            --config '{"ignorePatterns": [{"pattern": "^https://raw.githubusercontent.com"}]}' \
            docs/**/*.md

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdown-check:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Lint markdown files
        run: |
          npx --yes markdownlint-cli2 \
            'docs/**/*.md' \
            '*.md' \
            --config '{"default": true, "MD013": false, "MD033": false, "MD041": false}'

      - name: Check links in markdown
        run: |
          npx --yes markdown-link-check \
            --quiet \
            --config '{"ignorePatterns": [{"pattern": "^https://raw.githubusercontent.com"}]}' \
            docs/**/*.md

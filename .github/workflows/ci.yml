name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdown-check:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Lint markdown files
        run: npx --yes markdownlint-cli --config .markdownlint.json 'docs/**/*.md' '*.md'

      - name: Check links in markdown
        run: |
          find docs -name '*.md' -print0 | \
          xargs -0 npx --yes markdown-link-check \
            --quiet \
            --config .markdown-link-check.json
